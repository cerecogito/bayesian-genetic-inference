[project]
name = "bayesian-genetic-inference"
version = "0.1.0"
description = "Exact Bayesian inference of gene counts and traits over a synthetic family pedigree (educational, based on the CS50 AI Heredity model)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "matplotlib>=3.9",   # only used to draw the posterior chart
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bayesian_genetic_inference"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
